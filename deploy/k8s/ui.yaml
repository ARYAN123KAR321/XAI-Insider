apiVersion: apps/v1
kind: Deployment
metadata:
  name: xai-ui
  namespace: xai-insider
spec:
  replicas: 1
  selector:
    matchLabels: {app: xai-ui}
  template:
    metadata:
      labels: {app: xai-ui}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: ui
          image: xai-insider:1.0.0
          command: ["streamlit", "run", "app/ui/Home.py", "--server.port=8501", "--server.address=0.0.0.0"]
          env:
            - {name: API_BASE_URL, value: "http://xai-api:8000"}
          ports: [{containerPort: 8501}]
---
apiVersion: v1
kind: Service
metadata:
  name: xai-ui
  namespace: xai-insider
spec:
  type: NodePort
  selector: {app: xai-ui}
  ports: [{port: 8501, targetPort: 8501, nodePort: 30851}]